<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DoorDash Clone</title>
<style>
/* =========== BASE STYLES =========== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
/* =========== HEADER =========== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  background-color: #ff3008;
  color: #fff;
}
.header .logo {
  font-size: 1.25rem;
  font-weight: bold;
}
.header .menu {
  font-size: 1rem;
}
/* =========== HERO =========== */
.hero {
  text-align: center;
  padding: 2rem 1rem;
  background-color: #ffe5e2;
}
.hero h1 {
  font-size: 1.5rem;
}
.hero p {
  font-size: 1rem;
  margin: 1rem 0;
}
.hero .search-box {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
.hero .search-box input {
  padding: 0.5rem;
  flex: 1;
  border: 1px solid #ccc;
  border-radius: 4px 0 0 4px;
}
.hero .search-box button {
  padding: 0.5rem 1rem;
  background-color: #ff3008;
  color: #fff;
  border: none;
  border-radius: 0 4px 4px 0;
}
/* =========== RESPONSIVE (TABLET+) =========== */
@media (min-width: 640px) {
  .hero h1 {
    font-size: 2rem;
  }
  .hero p {
    font-size: 1.25rem;
  }
}
</style>
</head>
<body>
<header class="header">
  <div class="logo">DoorDash</div>
  <div class="menu">Menu</div>
</header>

<section class="hero">
  <h1>Order from your favorite restaurants</h1>
  <p>Get it delivered right to your door</p>
  <div class="search-box">
    <input type="text" placeholder="Enter your address" />
    <button>Search</button>
  </div>
</section>
</body>
</html>
